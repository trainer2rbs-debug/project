<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to RBS GitHub</title>
  <!-- Google Fonts for clean, modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <!-- Decorative animated background orbs -->
  <div class="bg-decoration" aria-hidden="true">
    <span class="bg-orb orb-1"></span>
    <span class="bg-orb orb-2"></span>
    <span class="bg-orb orb-3"></span>
  </div>

  <main class="auth-container">
    <section class="auth-card" aria-labelledby="login-title">
      <!-- Card Header / Brand Icon -->
      <header class="auth-header">
        <div class="brand-badge" aria-hidden="true">
          <!-- Shield Lock Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <h1 id="login-title">Welcome to RBS GitHub</h1>
        <p class="subtitle">Sign in to your account to continue</p>
      </header>

      <!-- Global Form Alert (Success / Error messages) -->
      <div id="formAlert" class="alert hidden" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <!-- Email Field -->
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>
            <input
              type="email"
              id="loginEmail"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="error-message" id="loginEmailError"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <!-- Show/Hide Password Toggle Button -->
            <button
              type="button"
              class="toggle-password"
              data-target="loginPassword"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
          <span class="error-message" id="loginPasswordError"></span>
        </div>

        <!-- Remember Me & Forgot Password Row -->
        <div class="form-options">
          <label class="checkbox-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span>Remember me</span>
          </label>
          <button type="button" id="forgotPasswordBtn" class="text-link">
            Forgot Password?
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">
          <span>Login</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>

      <!-- Link to Sign Up Page -->
      <footer class="auth-footer">
        <p>
          Don&apos;t have an account?
          <a href="signup.html" class="text-link font-semibold">Create Account</a>
        </p>
      </footer>
    </section>
  </main>

  <!-- Forgot Password Modal -->
  <div
    id="forgotModal"
    class="modal-backdrop hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="forgotModalTitle"
  >
    <div class="modal-card">
      <button
        type="button"
        id="closeModalBtn"
        class="modal-close"
        aria-label="Close modal"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>

      <div class="modal-header">
        <div class="brand-badge small" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4" />
          </svg>
        </div>
        <h2 id="forgotModalTitle">Reset Password</h2>
        <p class="subtitle">
          Enter your registered email address and we&apos;ll send you a reset link.
        </p>
      </div>

      <div id="forgotAlert" class="alert hidden" role="alert" aria-live="polite"></div>

      <form id="forgotForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="forgotEmail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
              </svg>
            </span>
            <input
              type="email"
              id="forgotEmail"
              name="forgotEmail"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>
          <span class="error-message" id="forgotEmailError"></span>
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">
            <span>Send Reset Link</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
